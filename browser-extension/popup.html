<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TradeMind AI Auto-Execute</title>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 4px;
      color: #22c55e;
    }
    p.sub {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px;
    }
    label {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      font-family: monospace;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #connectBtn { background: #22c55e; color: #052e16; }
    #disconnectBtn { background: #1e293b; color: #f87171; border: 1px solid #334155; }
    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      margin: 12px 0 8px;
    }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    #status.connected .dot { background: #22c55e; }
    #status.connected { color: #22c55e; }
    #log {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      height: 140px;
      overflow-y: auto;
      font-size: 10px;
      font-family: monospace;
    }
    #log .entry { margin-bottom: 4px; }
    #log .warn { color: #facc15; }
    #log .error { color: #f87171; }
    #log .info { color: #94a3b8; }
    #log .empty { color: #64748b; font-style: italic; }
  </style>
</head>
<body>
  <h1>TradeMind AI Auto-Execute</h1>
  <p class="sub">Demo accounts only. Paste the Session ID and Bot Token from the Trading Robot page.</p>

  <label for="sessionId">Session ID</label>
  <input id="sessionId" type="text" placeholder="Session ID" />

  <label for="botToken">Bot Token</label>
  <input id="botToken" type="text" placeholder="Bot Token" />

  <label for="backendUrl">Backend URL</label>
  <input id="backendUrl" type="text" placeholder="Backend URL" />

  <button id="connectBtn">Connect</button>
  <button id="disconnectBtn">Disconnect</button>

  <div id="status"><span class="dot"></span><span id="statusText">Not connected</span></div>

  <div id="log"><div class="empty">No activity yet.</div></div>

  <script src="popup.js"></script>
</body>
</html>
