workflows:
  ios-release:
    name: TradeMind AI - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: frontend
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.trademind.ai
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # frontend/.env.production is gitignored (not present in a fresh CI
        # checkout), so the production API URL is set here instead — Vite
        # picks up any VITE_-prefixed var from the environment automatically.
        VITE_API_URL: "https://trademind-ai-backend-2tnj.onrender.com"
      node: latest
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules
        - $CM_BUILD_DIR/frontend/ios/App/Pods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web app (production)
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build .ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android used to be built here too, but Codemagic's free plan has zero
  # Linux build minutes (confirmed via two failed builds) and Mac queue
  # times on the free tier were long. This repo is public, so GitHub
  # Actions gives it unlimited free minutes on any runner including Linux,
  # with much shorter queues and no manually-created token needed (Actions'
  # built-in GITHUB_TOKEN can publish releases directly) -- see
  # .github/workflows/android-release.yml instead.
