<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>TradeMind AI</title>
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        var h = new Date().getHours();
        var night = h >= 19 || h < 7;
        // Must match ThemeContext's resolve() so there's no light/dark flash.
        if (theme === "auto" ? night : theme !== "light") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
