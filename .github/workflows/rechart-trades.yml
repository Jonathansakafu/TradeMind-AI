name: Re-chart trade screenshots

# One-off maintenance (2026-10-14): replaces old auto-generated trade
# screenshots with the new signal chart picture (GET /api/cron/rechart-trades).
# Run "dry" first to count; then run for real -- it loops until done.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Only count (1) or replace (0)"
        required: true
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Replace in batches
        run: |
          for i in $(seq 1 40); do
            OUT=$(curl -sS -f --max-time 300 "https://trademind-ai-backend-2tnj.onrender.com/api/cron/rechart-trades?secret=${{ secrets.CRON_SECRET }}&limit=20&dry=${{ inputs.dry }}")
            echo "$OUT" | python3 -m json.tool
            REMAINING=$(echo "$OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['remaining'])")
            if [ "${{ inputs.dry }}" = "1" ] || [ "$REMAINING" = "0" ]; then break; fi
          done
